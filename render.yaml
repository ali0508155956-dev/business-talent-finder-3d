services:
  - type: web
    name: business-talent-finder-3d-preview
    runtime: static
    repo: https://github.com/ali0508155956-dev/business-talent-finder-3d
    branch: main
    buildCommand: node scripts/build.cjs
    staticPublishPath: ./dist
    previews:
      generation: automatic
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
